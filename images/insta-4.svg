<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="softGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFE7DC" />
      <stop offset="100%" stop-color="#E2D7C8" />
    </linearGradient>
    <pattern id="linen" width="20" height="20" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#FAF7F2" stroke-width="0.7" opacity="0.3"/>
      <line x1="0" y1="0" x2="0" y2="20" stroke="#FAF7F2" stroke-width="0.7" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#softGrad)" />
  <rect width="100%" height="100%" fill="url(#linen)" />
  
  <!-- Subtle Arch Frame -->
  <rect x="24" y="24" width="552" height="552" rx="4" fill="none" stroke="#FAF7F2" stroke-width="1.5" opacity="0.7"/>
  
  <!-- Minimalist Abstract Botanical / Aesthetic Line Art -->
  <g transform="translate(300, 270)" stroke="#2F4A3F" stroke-width="1.2" fill="none" opacity="0.45">
    <circle cx="0" cy="0" r="70" stroke-dasharray="2, 4"/>
    <path d="M 0 -80 C 25 -40, 25 40, 0 80 C -25 40, -25 -40, 0 -80 Z" stroke-width="1.5"/>
    <path d="M -60 0 C -30 25, 30 25, 60 0 C 30 -25, -30 -25, -60 0 Z" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="12" fill="#2F4A3F" fill-opacity="0.1"/>
  </g>
  
  <!-- Editorial Typography Watermark -->
  <g text-anchor="middle" font-family="'DM Sans', -apple-system, sans-serif">
    <text x="300" y="490" font-size="11" font-weight="600" letter-spacing="3" fill="#B08D57" text-transform="uppercase">Artistry</text>
    <text x="300" y="522" font-family="'Cormorant Garamond', Georgia, serif" font-size="24" font-weight="500" fill="#2B2623">The Natural Profile</text>
    <text x="300" y="548" font-size="12" letter-spacing="1" fill="#7A726A">@lumiere.scottsdale</text>
  </g>
  
  <!-- Subtle corner marks -->
  <line x1="36" y1="36" x2="48" y2="36" stroke="#B08D57" stroke-width="1"/>
  <line x1="36" y1="36" x2="36" y2="48" stroke="#B08D57" stroke-width="1"/>
  <line x1="564" y1="36" x2="552" y2="36" stroke="#B08D57" stroke-width="1"/>
  <line x1="564" y1="36" x2="564" y2="48" stroke="#B08D57" stroke-width="1"/>
</svg>
